<!-- Theme detection handled by CSS prefers-color-scheme + optional manual toggle -->
<script type="module">
  // Render README mermaid fences. kramdown emits them as plain code blocks
  // (pre > code.language-mermaid); a highlighter may wrap them in a div instead.
  const blocks = [...document.querySelectorAll('pre > code.language-mermaid, div.language-mermaid')]
    .map(node => node.matches('code') ? node.parentElement : node)
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
    for (const block of blocks) {
      const pre = document.createElement('pre')
      pre.className = 'mermaid'
      pre.textContent = block.textContent
      block.replaceWith(pre)
    }
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' })
    await mermaid.run()
  }
</script>
