[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tranfi"
version = "0.2.0"
description = "Streaming ETL language + runtime"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
keywords = ["etl", "csv", "streaming", "data", "pipeline", "transform"]
readme = "README.md"

[project.optional-dependencies]
duckdb = ["duckdb>=0.9.0"]

[project.scripts]
tranfi = "tranfi.cli:main"

[project.urls]
Repository = "https://github.com/tranfi/tranfi"

[tool.setuptools.packages.find]
include = ["tranfi*"]

[tool.setuptools.package-data]
tranfi = ["_native.c", "app/**"]
