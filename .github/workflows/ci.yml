name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'py/**'
      - 'js/**'
      - 'app/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'py/**'
      - 'js/**'
      - 'app/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      - name: Release C tests
        run: make test-c

      - name: ASan/UBSan gates
        run: |
          make test-debug
          make test-oom
          make test-spill-sec
          make test-depth-limits
          make test-float-rt
          make test-wide-csv

      - name: TSan thread-local error regression
        run: make test-tsan

  bindings-and-packaging:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip build pytest hypothesis pandas duckdb

      - name: Install Node test dependencies
        run: |
          npm ci
          npm install -g node-gyp
          (cd app && npm ci)
          (cd js && npm ci)

      - name: Python and property tests
        run: |
          make test-python
          make test-properties

      - name: Node tests
        run: make test-node

      - name: Package audits and clean install smokes
        run: make test-packaging

  fuzz-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Seeded native fuzz smoke
        run: make fuzz-smoke

  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Seeded native fuzz soak
        run: make fuzz-nightly
