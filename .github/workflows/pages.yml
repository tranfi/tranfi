name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'js/README.md'
      - 'py/README.md'
      - '_config.yml'
      - '_includes/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'CNAME'
      - 'app/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WASM
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make tranfi_wasm -j$(nproc)
          cp tranfi_core.js ../js/wasm/

      - name: Prepare app
        run: |
          mkdir -p app/public/wasm
          cp js/wasm/tranfi_core.js app/public/wasm/

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - uses: actions/configure-pages@v4
        id: pages

      - name: Build app
        working-directory: app
        run: npx vite build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/app/

      # Same Jekyll builder and theme as the branch-deployed polygrad.org and wlearn.org.
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add app to site
        run: sudo cp -r app/dist _site/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
